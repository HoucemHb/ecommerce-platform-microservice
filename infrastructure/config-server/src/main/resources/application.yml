# ===========================================
# CONFIG SERVER - application.yml
# File: infrastructure/config-server/src/main/resources/application.yml
# ===========================================

spring:
  application:
    name: config-server
  profiles:
    active: native  # Force native profile
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config,file:/config
        git:
          uri: https://github.com/spring-cloud-samples/config-repo  # Fallback, won't be used
          default-label: main
          skip-ssl-validation: true

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.boot: INFO

---
# ===========================================
# DOCKER PROFILE
# ===========================================
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config,file:/config  # Both locations
        bootstrap: true

logging:
  level:
    org.springframework.cloud.config: INFO