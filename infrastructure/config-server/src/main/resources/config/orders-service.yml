# ===========================================
# ORDERS SERVICE - application.yml
# File: orders-service/src/main/resources/application.yml
# ===========================================

spring:
  application:
    name: orders-service
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  
  # Datasource - Local Development
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders_user
    password: orders_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# Server Configuration
server:
  port: 8081

# Eureka Client - Local Development
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

# Axon Configuration - Local Development
axon:
  axonserver:
    servers: localhost:8124
    context: default
    enabled: true
    connect-timeout: 30000
    client-id: orders-service
  
  # Serializer Configuration
  serializer:
    general: jackson
    events: jackson
    messages: jackson

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

# Logging
logging:
  level:
    tn.fst.spring.ordersservice: DEBUG
    org.axonframework: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ===========================================
# DOCKER PROFILE
# ===========================================
spring:
  config:
    activate:
      on-profile: docker
  
  # Datasource - Docker
  datasource:
    url: jdbc:postgresql://postgres-orders:5432/orders_db
    username: orders_user
    password: orders_pass

# Eureka Client - Docker
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    hostname: orders-service
    prefer-ip-address: false

# Axon - Docker
axon:
  axonserver:
    servers: axon-server:8124  # ✅ No http://, just hostname:port
    context: default  # ✅ Must match Axon Server context
    keep-alive-time: 5000  # ✅ Added
    keep-alive-timeout: 10000  # ✅ Added

logging:
  level:
    org.axonframework: DEBUG  # ✅ See what's happening
    io.axoniq.axonserver: DEBUG  # ✅ Axon Server client logs

