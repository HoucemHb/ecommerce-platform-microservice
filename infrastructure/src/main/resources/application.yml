spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker

eureka:
  instance:
    hostname: discovery-server