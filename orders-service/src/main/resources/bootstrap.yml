# ===========================================
# ORDERS SERVICE - bootstrap.yml
# File: orders-service/src/main/resources/bootstrap.yml
# ===========================================

spring:
  application:
    name: orders-service
  
  cloud:
    config:
      enabled: false  # ✅ DISABLE Config Server for now - use application.yml
      fail-fast: false

---
# ===========================================
# DOCKER PROFILE
# ===========================================
spring:
  config:
    activate:
      on-profile: docker
  
  cloud:
    config:
      enabled: false  # ✅ Keep disabled - use application.yml with docker profile