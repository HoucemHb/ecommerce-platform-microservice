spring:
  application:
    name: orders-service
  cloud:
    config:
      uri: http://localhost:8888  # Config Server URL
      fail-fast: true  # Fail if config server is down
      retry:
        initial-interval: 1000
        max-attempts: 6

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    config:
      uri: http://config-server:8888